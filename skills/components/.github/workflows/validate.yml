name: validate

on:
  push:
    paths:
      - "components.json"
      - "scripts/validate.py"
      - "scripts/test_validate.py"
      - "scripts/_registry.py"
      - "scripts/registry_pin.py"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "components.json"
      - "scripts/validate.py"
      - "scripts/test_validate.py"
      - "scripts/_registry.py"
      - "scripts/registry_pin.py"
  workflow_dispatch:
  schedule:
    # Quarterly sanity check (1st of Jan/Apr/Jul/Oct, 06:00 UTC).
    - cron: "0 6 1 1,4,7,10 *"

jobs:
  json:
    name: validate components.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate JSON + required fields
        # Same script contributors run locally, so CI cannot disagree with them.
        run: python3 scripts/validate.py
      - name: Test the validator itself
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v
